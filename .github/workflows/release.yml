# .github/workflows/release.yml
name: Build XPI (release branches)

# Сборка запускается только для веток вида release/x.x.x
on:
  push:
    branches:
      - 'release/*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Smoke Test XPI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Извлекаем версию из имени ветки: release/1.2.3 -> 1.2.3
      - name: Extract version from branch name
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#release/}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Branch name '$GITHUB_REF_NAME' does not match release/x.y.z pattern" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Smoke-тест 1: lint манифеста и исходников расширения
      - name: Smoke test — web-ext lint
        run: npx --yes web-ext@10.6.0 lint --source-dir .

      # Сборка XPI из корня репозитория (manifest.json лежит в корне)
      - name: Build XPI with web-ext
        run: |
          npx --yes web-ext@10.6.0 build \
            --source-dir . \
            --artifacts-dir ./dist \
            --filename "container-foxyproxy-importer-${{ steps.version.outputs.version }}.xpi" \
            --overwrite-dest \
            --ignore-files \
              .github \
              .gitignore \
              .gitattributes \
              README.md \
              LICENSE

      # Smoke-тест 2: проверяем, что XPI создан, содержит manifest.json
      # и версия в манифесте совпадает с версией из имени ветки
      - name: Smoke test — verify XPI contents and version
        run: |
          XPI="dist/container-foxyproxy-importer-${{ steps.version.outputs.version }}.xpi"

          if [[ ! -f "$XPI" ]]; then
            echo "XPI file was not created: $XPI" >&2
            exit 1
          fi

          if ! unzip -l "$XPI" | grep -q "manifest.json"; then
            echo "manifest.json is missing inside the XPI" >&2
            exit 1
          fi

          MANIFEST_VERSION=$(unzip -p "$XPI" manifest.json | jq -r '.version')
          if [[ "$MANIFEST_VERSION" != "${{ steps.version.outputs.version }}" ]]; then
            echo "Version mismatch: branch expects ${{ steps.version.outputs.version }}, manifest says $MANIFEST_VERSION" >&2
            exit 1
          fi

          echo "Smoke test passed: $XPI contains manifest.json with version $MANIFEST_VERSION"

      - name: Upload XPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: container-foxyproxy-importer-${{ steps.version.outputs.version }}.xpi
          path: dist/container-foxyproxy-importer-${{ steps.version.outputs.version }}.xpi
          if-no-files-found: error
          retention-days: 90
