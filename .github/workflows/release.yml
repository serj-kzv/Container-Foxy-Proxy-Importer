name: Build XPI (release branches)

on:
  push:
    branches:
      - 'release/*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  WEB_EXT_VERSION: '10.6.0'
  EXTENSION_NAME: 'container-foxyproxy-importer'
  EXTENSION_DESCRIPTION: 'Import FoxyProxy configurations into Firefox, turn every proxy into a Firefox container, and route each container through its own proxy — automatically.'

jobs:
  build:
    name: Build & Release XPI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Extract version from branch name
        id: version
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${BRANCH_NAME#release/}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Branch name '$BRANCH_NAME' does not match release/x.y.z pattern"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Smoke test — web-ext lint
        run: >-
          npx --yes "web-ext@${WEB_EXT_VERSION}" lint
          --source-dir .
          --ignore-files .github .gitignore .gitattributes README.md LICENSE
          --no-input

      - name: Build XPI with web-ext
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npx --yes "web-ext@${WEB_EXT_VERSION}" build \
            --source-dir . \
            --artifacts-dir ./dist \
            --filename "${EXTENSION_NAME}-${VERSION}.xpi" \
            --overwrite-dest \
            --no-input \
            --ignore-files \
              .github \
              .gitignore \
              .gitattributes \
              README.md \
              LICENSE

      - name: Smoke test — verify XPI contents and version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          XPI="dist/${EXTENSION_NAME}-${VERSION}.xpi"

          if [[ ! -f "$XPI" ]]; then
            echo "::error::XPI file was not created: $XPI"
            exit 1
          fi

          if ! unzip -l "$XPI" | grep -q "manifest.json"; then
            echo "::error::manifest.json is missing inside the XPI"
            exit 1
          fi

          MANIFEST_VERSION="$(unzip -p "$XPI" manifest.json | jq -r '.version')"
          if [[ "$MANIFEST_VERSION" != "$VERSION" ]]; then
            echo "::error::Version mismatch: branch expects $VERSION, manifest says $MANIFEST_VERSION"
            exit 1
          fi

          DEFAULT_LOCALE="$(unzip -p "$XPI" manifest.json | jq -r '.default_locale // empty')"
          if [[ -z "$DEFAULT_LOCALE" ]]; then
            echo "::error::manifest.json uses __MSG_ placeholders but has no default_locale"
            exit 1
          fi

          if ! unzip -l "$XPI" | grep -q "_locales/${DEFAULT_LOCALE}/messages.json"; then
            echo "::error::_locales/${DEFAULT_LOCALE}/messages.json is missing inside the XPI"
            exit 1
          fi

          echo "Smoke test passed: $XPI, manifest version $MANIFEST_VERSION, locale ${DEFAULT_LOCALE} OK"

      - name: Create GitHub Release with XPI
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Container FoxyProxy Importer v${{ steps.version.outputs.version }}
          body: ${{ env.EXTENSION_DESCRIPTION }}
          files: dist/${{ env.EXTENSION_NAME }}-${{ steps.version.outputs.version }}.xpi
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
